<!DOCTYPE html>
<html lang="kk">
<head>
  <!-- ТҮЗЕТУ 1: <!DOCTYPE> қосылды (quirks mode болмауы үшін) және lang="kk" берілді -->
  <!-- ТҮЗЕТУ 2: charset қосылды — қазақ әріптері «???» болып бұзылмайды -->
  <meta charset="UTF-8">
  <!-- ТҮЗЕТУ 3: viewport қосылды — мобильді құрылғыда дұрыс масштабталады -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ТҮЗЕТУ 4: <title> body ішінен head ішіне көшірілді -->
  <title>Менің бетім</title>
  <meta name="description" content="Түзетілген бет">
</head>
<!-- ТҮЗЕТУ 5: head пен body реті қалпына келтірілді (алдымен head, содан кейін body) -->
<body>
  <!-- ТҮЗЕТУ 6: жабылмаған <h1> жабылды -->
  <h1>Сәлем, әлем!</h1>
  <!-- ТҮЗЕТУ 7: <p> тегтері жабылды -->
  <p>Бұл бірінші абзац.</p>
  <!-- ТҮЗЕТУ 8: <b> және <i> дұрыс ішкі-ішке орналасты (кезектесіп жабылмайды) -->
  <p>Бұл екінші абзац, <b>қалың мәтін<i> және көлбеу</i></b>.</p>
  <!-- ТҮЗЕТУ 9: <li> элементтері жабылды -->
  <ul>
    <li>Бірінші</li>
    <li>Екінші</li>
  </ul>
  <!-- ТҮЗЕТУ 10: суретке міндетті alt атрибуты қосылды -->
  <img src="img/avatar.png" alt="Студенттің аватары" width="160" height="160">
  <!-- ТҮЗЕТУ 11: href атрибутының жабылмаған тырнақшасы жабылды -->
  <a href="https://example.com">Сілтеме</a>
</body>
</html>
